name: DigitalOrbit Growth Automation

on:
  workflow_dispatch:
    inputs:
      smart_engagement:
        description: "Smart Engagement Research"
        type: boolean
        required: false
        default: true
      youtube_analytics:
        description: "YouTube Analytics Report"
        type: boolean
        required: false
        default: true
      viral_content:
        description: "Viral Hook & Title Generator"
        type: boolean
        required: false
        default: true
      community_posts:
        description: "Community Post Generator"
        type: boolean
        required: false
        default: true
      publishing_analyzer:
        description: "Best Publishing Time Analyzer"
        type: boolean
        required: false
        default: true
      weekly_report:
        description: "Weekly Growth Report"
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "0 14 * * 1"
      # Weekly Monday run; GitHub schedule uses UTC.

permissions:
  contents: read

concurrency:
  group: digitalorbit-growth-automation
  cancel-in-progress: false

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests feedparser google-api-python-client google-auth google-auth-oauthlib

      - name: Run selected growth modules
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          RUN_SMART_ENGAGEMENT: ${{ github.event_name == 'schedule' || inputs.smart_engagement }}
          RUN_YOUTUBE_ANALYTICS: ${{ github.event_name == 'schedule' || inputs.youtube_analytics }}
          RUN_VIRAL_CONTENT: ${{ github.event_name == 'schedule' || inputs.viral_content }}
          RUN_COMMUNITY_POSTS: ${{ github.event_name == 'schedule' || inputs.community_posts }}
          RUN_PUBLISHING_ANALYZER: ${{ github.event_name == 'schedule' || inputs.publishing_analyzer }}
          RUN_WEEKLY_REPORT: ${{ github.event_name == 'schedule' || inputs.weekly_report }}
        run: python growth_automation.py

      - name: Save Growth Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digitalorbit-growth-reports
          path: growth_reports/
          if-no-files-found: warn
          retention-days: 30
