name: Digital Orbit Long Video (Private)

on:
  workflow_dispatch:
  schedule:
    # Separate daily long-form run. Shorts workflow remains unchanged.
    - cron: "30 15 * * *"

permissions:
  contents: read

concurrency:
  group: digital-orbit-long-video
  cancel-in-progress: false

jobs:
  build-and-upload-private:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate, quality-check and upload one private long video
        env:
          GOOGLE_API_KEY_1: \${{ secrets.GOOGLE_API_KEY_1 }}
          GOOGLE_API_KEY_2: \${{ secrets.GOOGLE_API_KEY_2 }}
          GOOGLE_API_KEY_3: \${{ secrets.GOOGLE_API_KEY_3 }}
          GOOGLE_API_KEY: \${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_TOKEN_JSON: \${{ secrets.YOUTUBE_TOKEN_JSON }}
          LONG_VIDEO_VOICE: en-US-AndrewNeural
          PYTHONUNBUFFERED: "1"
        run: python -u long_form.py
      - name: Save private review pack
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: digital-orbit-long-video-review
          path: |
            long_form_output/digital_orbit_long_private.mp4
            long_form_output/scene_*.jpg
            long_form_output/captions.srt
            long_form_output/script.txt
            long_form_output/quality_report.json
          if-no-files-found: ignore
          retention-days: 14
