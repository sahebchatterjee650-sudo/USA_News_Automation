
name: USA News Automation

on:
  workflow_dispatch:
  schedule:
    # Eastern Daylight Time (EDT)
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '0 21 * * *'

    # Eastern Standard Time (EST)
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

permissions:
  contents: read

concurrency:
  group: usa-news-automation
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set batch configuration
        id: batch
        env:
          SCHEDULE_TIME: ${{ github.event.schedule }}
        run: |
          ET_HOUR=$(TZ=America/New_York date +%H)

          if [ "$SCHEDULE_TIME" = "" ]; then
            echo "Manual run detected. Defaulting to batch 1."
            BATCH=1

          elif [ "$ET_HOUR" = "09" ]; then
            BATCH=1

          elif [ "$ET_HOUR" = "13" ]; then
            BATCH=2

          elif [ "$ET_HOUR" = "17" ]; then
            BATCH=3

          else
            echo "This cron is not active in the current ET season."
            echo "Skipping this run successfully."
            echo "RUN_BATCH=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "RUN_BATCH=true" >> "$GITHUB_ENV"
          echo "BATCH_NUMBER=$BATCH" >> "$GITHUB_ENV"

          if [ "$BATCH" = "1" ]; then
            PUBLISH_TIME="09:00"
          elif [ "$BATCH" = "2" ]; then
            PUBLISH_TIME="13:00"
          else
            PUBLISH_TIME="17:00"
          fi

          echo "ET_PUBLISH_TIME=$PUBLISH_TIME" >> "$GITHUB_ENV"
          echo "VOICE_OFFSET=$(( (BATCH - 1) * 3 ))" >> "$GITHUB_ENV"

          echo "Batch: $BATCH"
          echo "ET release: $PUBLISH_TIME"
          echo "ET hour: $ET_HOUR"

      - name: Set up Python
        if: env.RUN_BATCH == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
        timeout-minutes: 3

       - name: Install FFmpeg
        if: env.RUN_BATCH == 'true'
        timeout-minutes: 25
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        if: env.RUN_BATCH == 'true'
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify required tools
        if: env.RUN_BATCH == 'true'
        run: |
          python --version
          ffmpeg -version
          ffprobe -version
          python -c "import feedparser, edge_tts; from PIL import Image; from google import genai; print('All required packages are ready.')"

      - name: Generate news scripts and videos
        if: env.RUN_BATCH == 'true'
        timeout-minutes: 60
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_1: ${{ secrets.GOOGLE_API_KEY_1 }}
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
          GOOGLE_API_KEY_3: ${{ secrets.GOOGLE_API_KEY_3 }}
          BATCH_NUMBER: ${{ env.BATCH_NUMBER }}
          ET_PUBLISH_TIME: ${{ env.ET_PUBLISH_TIME }}
          VOICE_OFFSET: ${{ env.VOICE_OFFSET }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u main.py

      - name: Upload videos to YouTube privately
        if: env.RUN_BATCH == 'true' && success() && hashFiles('output_videos/*.mp4') != ''
        timeout-minutes: 30
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          BATCH_NUMBER: ${{ env.BATCH_NUMBER }}
          ET_PUBLISH_TIME: ${{ env.ET_PUBLISH_TIME }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u youtube_upload.py

      - name: Save generated scripts and videos
        if: always() && env.RUN_BATCH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digital-orbit-news-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scripts.txt
            output_videos/
          if-no-files-found: ignore
          retention-days: 90
