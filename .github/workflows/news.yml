
name: USA News Automation

on:
  workflow_dispatch:

  # Start two hours before the intended Eastern publication slots to allow for Actions queue delays.
  # The publication targets below remain 09:00, 13:00 and 17:00 ET.
  schedule:
    # Eastern Daylight Time (EDT)
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'

    # Eastern Standard Time (EST)
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'

permissions:
  contents: read

concurrency:
  group: usa-news-automation
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        timeout-minutes: 3

      # =================================
      # BATCH CONFIGURATION
      # =================================

      - name: Set batch configuration
        env:
          SCHEDULE_TIME: ${{ github.event.schedule }}
        run: |
          ET_OFFSET=$(TZ=America/New_York date +%z)

          BATCH=0

          if [ -z "$SCHEDULE_TIME" ]; then
            echo "Manual run detected."
            BATCH=1

          else
            case "$SCHEDULE_TIME" in

              "0 11 * * *")
                if [ "$ET_OFFSET" = "-0400" ]; then
                  BATCH=1
                fi
                ;;

              "0 15 * * *")
                if [ "$ET_OFFSET" = "-0400" ]; then
                  BATCH=2
                fi
                ;;

              "0 19 * * *")
                if [ "$ET_OFFSET" = "-0400" ]; then
                  BATCH=3
                fi
                ;;

              "0 12 * * *")
                if [ "$ET_OFFSET" = "-0500" ]; then
                  BATCH=1
                fi
                ;;

              "0 16 * * *")
                if [ "$ET_OFFSET" = "-0500" ]; then
                  BATCH=2
                fi
                ;;

              "0 20 * * *")
                if [ "$ET_OFFSET" = "-0500" ]; then
                  BATCH=3
                fi
                ;;

            esac
          fi

          if [ "$BATCH" = "0" ]; then
            echo "Inactive seasonal schedule."
            echo "RUN_BATCH=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "RUN_BATCH=true" >> "$GITHUB_ENV"
          echo "BATCH_NUMBER=$BATCH" >> "$GITHUB_ENV"

          if [ "$BATCH" = "1" ]; then
            PUBLISH_TIME="09:00"
          elif [ "$BATCH" = "2" ]; then
            PUBLISH_TIME="13:00"
          else
            PUBLISH_TIME="17:00"
          fi

          VOICE_OFFSET=$(( (BATCH - 1) * 3 ))

          echo "ET_PUBLISH_TIME=$PUBLISH_TIME" >> "$GITHUB_ENV"
          echo "VOICE_OFFSET=$VOICE_OFFSET" >> "$GITHUB_ENV"

          echo "================================="
          echo "USA NEWS AUTOMATION"
          echo "Batch: $BATCH"
          echo "ET release: $PUBLISH_TIME"
          echo "ET offset: $ET_OFFSET"
          echo "Voice offset: $VOICE_OFFSET"
          echo "================================="

      # =================================
      # PYTHON SETUP
      # =================================

      - name: Set up Python
        if: env.RUN_BATCH == 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
        timeout-minutes: 5

      # =================================
      # FFMPEG
      # =================================

      - name: Install FFmpeg
        if: env.RUN_BATCH == 'true'
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      # =================================
      # PYTHON DEPENDENCIES
      # =================================

      - name: Install Python dependencies
        if: env.RUN_BATCH == 'true'
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # =================================
      # VERIFY TOOLS
      # =================================

      - name: Verify required tools
        if: env.RUN_BATCH == 'true'
        run: |
          python --version
          ffmpeg -version
          ffprobe -version

          python -c "import feedparser, edge_tts; from PIL import Image; print('Core packages are ready; Gemini is optional.')"

      # =================================
      # GENERATE VIDEOS
      # =================================

      - name: Generate news scripts and videos
        if: env.RUN_BATCH == 'true'
        timeout-minutes: 60
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_1: ${{ secrets.GOOGLE_API_KEY_1 }}
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
          GOOGLE_API_KEY_3: ${{ secrets.GOOGLE_API_KEY_3 }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

          BATCH_NUMBER: ${{ env.BATCH_NUMBER }}
          ET_PUBLISH_TIME: ${{ env.ET_PUBLISH_TIME }}
          VOICE_OFFSET: ${{ env.VOICE_OFFSET }}
          MAX_STORIES: "3"

          PYTHONUNBUFFERED: "1"

        run: |
          python -u main.py

      # Keep generated Shorts covers and image credits available for review.
      # The MP4 itself is uploaded to YouTube; only small cover/credit files are retained here.
      - name: Save Shorts thumbnails and image credits
        if: always() && env.RUN_BATCH == 'true'
        uses: actions/upload-artifact@v6.0.0
        with:
          name: digital-orbit-content-pack
          path: |
            output_videos/thumbnail_*.jpg
            output_videos/community_quiz_*.jpg
            output_videos/community_quiz_*.txt
            output_videos/daily_top_3.txt
            output_videos/image_attributions.txt
            output_videos/scripts.txt
          if-no-files-found: ignore
          retention-days: 14
