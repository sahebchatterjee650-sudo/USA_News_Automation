name: Safe Growth System Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "tests/**"
      - ".github/workflows/growth-tests.yml"

permissions:
  contents: read

jobs:
  test-growth-system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install only runtime libraries needed for import and tests
        run: |
          python -m pip install --disable-pip-version-check feedparser edge-tts Pillow requests

      - name: Compile Python files
        run: |
          python -m py_compile main.py tests/test_growth_system.py

      - name: Run offline editorial tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m unittest discover -s tests -v
